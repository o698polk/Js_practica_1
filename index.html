<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
 <title>EJER-1</title>

<body>
    <div class="calculadora">
     <h1>Calculadora Basica</h1>
     <p>Ingrese dos numero para realizar una operacion aritmetica</p>
     
     <form>
        <label for="numero1">Primer Numero</label>
        <input type="number" id="numero1" placeholder="Ingrese el primer numero">

        <label for="numero2">Segundo Numero</label>
        <input type="number" id="numero2" placeholder="Ingresa el segundo numero">

        <div class="botones">
            <button onclick="sumar()">Sumar(+)</button>
            <button onclick="restar()">Restar(-)</button>
        </div>
        <div class="resultados">
            <h3>Resultado:</h3>
            <p id="resultado">  


            </p>

        </div>
     </form>



    </div>

    


    <script src="assets/js/main.js" ></script>
</body>
