<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
 <title>EJER-1</title>
 <link rel="stylesheet" href="assets/css/stylos.css">
</head>
<body>
    
     <div class="calculadora">
        <h1>Calculadora Básica</h1>
        <p>Ingresa dos números para realizar una operación.</p>

        <label for="numero1">Primer número:</label>
        <input type="number" id="numero1" placeholder="Ingresa el primer número">

        <label for="numero2">Segundo número:</label>
        <input type="number" id="numero2" placeholder="Ingresa el segundo número">

        <div class="botones">
            <button onclick="sumar()">Sumar (+)</button>
            <button onclick="multiplicar()">Multiplicar (×)</button>
        </div>

        <div class="resultado">
            <h3>Resultado:</h3>
            <p id="resultado">Aquí aparecerá el resultado</p>
        </div>
    </div>







    


    <script src="assets/js/main.js" ></script>
</body>
</html>
